apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app2

  template:
    metadata:
      labels:
        app: app2

    spec:
      containers:
        - name: apache
          image: httpd:2.4

          ports:
            - containerPort: 80

          volumeMounts:
            - name: bakery-content
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
              readOnly: true

      volumes:
        - name: bakery-content
          configMap:
            name: bakery-website

---
apiVersion: v1
kind: Service
metadata:
  name: app2-service

spec:
  selector:
    app: app2

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
