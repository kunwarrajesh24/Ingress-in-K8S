kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8000
        protocol: TCP




## Create the cluster
kind create cluster --name ingress-lab --config kind-ingress.yaml
##Verify the cluster
kubectl cluster-info --context kind-ingress-lab
